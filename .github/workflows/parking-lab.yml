name: ParkingOps Lab checks
on:
  push:
    paths: ['software/parking-ops-lab/**', '.github/workflows/parking-lab.yml']
  pull_request:
    paths: ['software/parking-ops-lab/**', '.github/workflows/parking-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/parking-ops-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: software/parking-ops-lab/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m parkinglab --trials 50 --output results/ci

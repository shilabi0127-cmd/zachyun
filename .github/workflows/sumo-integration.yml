name: SUMO integration
on:
  push:
    paths: ['software/junction-agents/**', '.github/workflows/sumo-integration.yml']
  pull_request:
    paths: ['software/junction-agents/**', '.github/workflows/sumo-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/junction-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: software/junction-agents/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-sumo.txt
      - run: python -m pytest -q
        env:
          RUN_SUMO_TESTS: '1'
